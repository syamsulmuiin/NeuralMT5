[project]
name = "neuralmt5"
version = "0.1.0"
description = "Local, deterministic, broker-agnostic MT5 neural trading system."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
mt5 = ["MetaTrader5>=5.0.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
